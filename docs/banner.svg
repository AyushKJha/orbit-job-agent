<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Orbit — a calmer way to move your career forward</title>
  <desc id="desc">Warm ivory and evergreen Orbit brand artwork with an orbital career path, opportunity cards, and a coral star.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#eee9dd"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#243b31"/>
      <stop offset="1" stop-color="#405b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#f77758" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f77758" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.8">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#101b15" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#paper)"/>
  <circle cx="1030" cy="170" r="170" fill="url(#glow)"/>
  <g transform="translate(42 37)">
    <rect width="42" height="42" rx="13" fill="#21382f"/>
    <path d="M30 10a14 14 0 1 0 4 14" fill="none" stroke="#f5eedf" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M10 30h6v-5h5v-5h5v-5h4" fill="none" stroke="#b7d6c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m31 9 1.4 2.8 2.8 1.4-2.8 1.4-1.4 2.8-1.4-2.8-2.8-1.4 2.8-1.4Z" fill="#ff7959"/>
    <text x="54" y="28" fill="#242520" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">orbit<tspan fill="#f77758">.</tspan></text>
  </g>
  <text x="44" y="134" fill="#7a8479" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">YOUR CAREER SEARCH, WITH MORE INTENTION</text>
  <text x="42" y="195" fill="#272923" font-family="Georgia,serif" font-size="51" letter-spacing="-1.5">Make your next <tspan fill="#f16f52" font-style="italic">move.</tspan></text>
  <text x="46" y="232" fill="#6d7169" font-family="Segoe UI,Arial,sans-serif" font-size="17">Find roles that fit. Reach out with care. Keep every decision yours.</text>
  <g transform="translate(46 266)">
    <rect width="333" height="35" rx="17.5" fill="#e7e2d6"/>
    <circle cx="19" cy="17.5" r="4" fill="#ef7456"/>
    <text x="33" y="22" fill="#51594f" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">DISCOVER  ·  PREPARE  ·  REVIEW</text>
  </g>
  <g transform="translate(724 24)">
    <rect width="438" height="292" rx="20" fill="url(#forest)"/>
    <circle cx="305" cy="145" r="119" fill="none" stroke="#b8d8c0" stroke-opacity=".22"/>
    <ellipse cx="305" cy="145" rx="147" ry="54" fill="none" stroke="#c8ddca" stroke-opacity=".32" transform="rotate(-28 305 145)"/>
    <ellipse cx="305" cy="145" rx="147" ry="54" fill="none" stroke="#c8ddca" stroke-opacity=".22" transform="rotate(30 305 145)"/>
    <circle cx="305" cy="145" r="44" fill="#f47758"/>
    <path d="m305 126 6 13 14 6-14 6-6 13-6-13-13-6 13-6Z" fill="#fff5e7"/>
    <circle cx="178" cy="80" r="4" fill="#f6ce9b"/>
    <circle cx="421" cy="216" r="3" fill="#b7d6c3"/>
    <g filter="url(#shadow)">
      <rect x="27" y="42" width="168" height="54" rx="14" fill="#f8f5ed" transform="rotate(-4 27 42)"/>
      <circle cx="54" cy="68" r="14" fill="#dfece0"/>
      <path d="m49 68 4 4 7-9" fill="none" stroke="#53745c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="65" fill="#30352f" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Roles that fit</text>
      <text x="76" y="81" fill="#85877d" font-family="Segoe UI,Arial,sans-serif" font-size="9">Your story, in focus</text>
      <rect x="252" y="219" width="160" height="50" rx="14" fill="#f8f5ed" transform="rotate(-3 252 219)"/>
      <circle cx="278" cy="243" r="13" fill="#f9e2d5"/>
      <path d="M272 239h12v9h-12z m0 1 6 4 6-4" fill="none" stroke="#cd704f" stroke-width="1.3" stroke-linejoin="round"/>
      <text x="301" y="241" fill="#30352f" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">Your voice, your call</text>
      <text x="301" y="256" fill="#85877d" font-family="Segoe UI,Arial,sans-serif" font-size="9">You approve every send</text>
    </g>
    <text x="25" y="275" fill="#d5e4d7" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1.8">A CAREER WORKSPACE THAT KEEPS YOU IN CONTROL</text>
  </g>
</svg>
