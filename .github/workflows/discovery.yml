name: Scheduled discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: read
concurrency:
  group: orbit-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: ${{ vars.ORBIT_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wake Orbit and run due searches and reply checks
        env:
          ORBIT_URL: ${{ vars.ORBIT_URL }}
          CRON_SECRET: ${{ secrets.ORBIT_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 1200 \
            --request POST --header "Authorization: Bearer $CRON_SECRET" \
            "$ORBIT_URL/internal/schedule"
