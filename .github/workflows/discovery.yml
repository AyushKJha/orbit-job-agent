name: Scheduled discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: read
concurrency:
  group: orbit-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: ${{ vars.ORBIT_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wake Orbit for due searches and reply checks
        env:
          ORBIT_URL: ${{ vars.ORBIT_URL }}
        run: |
          curl --fail --silent --show-error --max-time 240 "$ORBIT_URL/health"
