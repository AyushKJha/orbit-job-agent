services:
  - type: web
    name: orbit-job-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EPHEMERAL_HOSTING
        value: "true"
      - key: JOB_AGENT_DATA
        value: /var/data/orbit
      - key: PORT
        value: 10000
      - key: VAULT_KEY
        sync: false
      - key: SIGNUP_CODE
        sync: false
      - key: STORAGE_GATEWAY_URL
        sync: false
      - key: STORAGE_GATEWAY_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
