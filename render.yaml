services:
  - type: web
    name: orbit-job-agent
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: orbit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JOB_AGENT_DATA
        value: /var/data/orbit
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: VAULT_KEY
        sync: false
      - key: SIGNUP_CODE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
