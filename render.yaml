services:
  - type: web
    name: orbit-job-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EPHEMERAL_HOSTING
        value: "true"
      - key: JOB_AGENT_DATA
        value: /var/data/orbit
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: VAULT_KEY
        sync: false
      - key: SIGNUP_CODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: orbit-private
      - key: CRON_SECRET
        sync: false
